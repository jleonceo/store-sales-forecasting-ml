name: pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Reproducir el proyecto y comprobar las cifras
        run: python ejecutar_todo.py
